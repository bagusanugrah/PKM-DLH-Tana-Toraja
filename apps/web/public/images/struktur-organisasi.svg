<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" fill="none">
  <rect width="900" height="650" fill="#f8fafc" rx="12"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="860" height="70" rx="8" fill="#1F6B4A"/>
  <text x="450" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    BAGAN STRUKTUR ORGANISASI
  </text>
  <text x="450" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">
    DINAS LINGKUNGAN HIDUP KABUPATEN TANA TORAJA
  </text>

  <!-- Level 1: Kepala Dinas -->
  <g transform="translate(330, 115)">
    <rect width="240" height="65" rx="8" fill="#ffffff" stroke="#1F6B4A" stroke-width="2.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="120" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1F6B4A" text-anchor="middle">KEPALA DINAS</text>
    <text x="120" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Ir. Yulius Sampe Rante, M.Si</text>
  </g>

  <!-- Line from Kadis down -->
  <line x1="450" y1="180" x2="450" y2="215" stroke="#1F6B4A" stroke-width="2"/>

  <!-- Level 2: Sekretaris Dinas -->
  <g transform="translate(330, 215)">
    <rect width="240" height="65" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="120" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">SEKRETARIS DINAS</text>
    <text x="120" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Dra. Maria Pongtiku</text>
  </g>

  <!-- Line from Sekretaris to Subag -->
  <line x1="570" y1="247" x2="680" y2="247" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <g transform="translate(680, 218)">
    <rect width="180" height="58" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Subbagian Umum &amp;</text>
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Kepegawaian</text>
  </g>

  <!-- Main horizontal distribution line for 3 Bidang -->
  <line x1="450" y1="280" x2="450" y2="325" stroke="#1F6B4A" stroke-width="2"/>
  <line x1="160" y1="325" x2="740" y2="325" stroke="#1F6B4A" stroke-width="2"/>

  <!-- Drops to 3 Bidang -->
  <line x1="160" y1="325" x2="160" y2="355" stroke="#1F6B4A" stroke-width="2"/>
  <line x1="450" y1="325" x2="450" y2="355" stroke="#1F6B4A" stroke-width="2"/>
  <line x1="740" y1="325" x2="740" y2="355" stroke="#1F6B4A" stroke-width="2"/>

  <!-- Bidang 1: Pengelolaan Sampah & Limbah B3 -->
  <g transform="translate(45, 355)">
    <rect width="230" height="95" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="115" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">BIDANG PENGELOLAAN SAMPAH</text>
    <text x="115" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">&amp; LIMBAH B3</text>
    <line x1="15" y1="52" x2="215" y2="52" stroke="#e2e8f0"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Markus Tandi, S.T., M.Env</text>
    <text x="115" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Kepala Bidang</text>
  </g>

  <!-- Bidang 2: Pengendalian Pencemaran -->
  <g transform="translate(335, 355)">
    <rect width="230" height="95" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="115" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">BIDANG PENGENDALIAN PENCEMARAN</text>
    <text x="115" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">&amp; KERUSAKAN LINGKUNGAN</text>
    <line x1="15" y1="52" x2="215" y2="52" stroke="#e2e8f0"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Elisabeth Rombe, S.Hut</text>
    <text x="115" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Kepala Bidang</text>
  </g>

  <!-- Bidang 3: Penaatan & Peningkatan Kapasitas -->
  <g transform="translate(625, 355)">
    <rect width="230" height="95" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="115" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">BIDANG PENAATAN &amp;</text>
    <text x="115" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">PENINGKATAN KAPASITAS</text>
    <line x1="15" y1="52" x2="215" y2="52" stroke="#e2e8f0"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Yohanis Salusu, S.Sos</text>
    <text x="115" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Kepala Bidang</text>
  </g>

  <!-- Sub-units under Bidang 1 -->
  <line x1="160" y1="450" x2="160" y2="480" stroke="#0284c7" stroke-width="1.5"/>
  <g transform="translate(55, 480)">
    <rect width="210" height="50" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Seksi Pengurangan &amp;</text>
    <text x="105" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Pemanfaatan Sampah</text>
  </g>

  <!-- Sub-units under Bidang 2 -->
  <line x1="450" y1="450" x2="450" y2="480" stroke="#059669" stroke-width="1.5"/>
  <g transform="translate(345, 480)">
    <rect width="210" height="50" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Seksi Pemantauan Kualitas</text>
    <text x="105" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Air, Udara &amp; Tanah</text>
  </g>

  <!-- Sub-units under Bidang 3 -->
  <line x1="740" y1="450" x2="740" y2="480" stroke="#d97706" stroke-width="1.5"/>
  <g transform="translate(635, 480)">
    <rect width="210" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="105" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Seksi Pengaduan &amp;</text>
    <text x="105" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Penyelesaian Sengketa</text>
  </g>

  <!-- Footer note -->
  <text x="450" y="620" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Berdasarkan Peraturan Daerah Kabupaten Tana Toraja tentang Kedudukan, Susunan Organisasi, Tugas dan Fungsi DLH.
  </text>
</svg>
